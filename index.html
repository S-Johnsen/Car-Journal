<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Johnsen Auto Journal</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/storage.js" defer></script>
    <script src="js/vehicles.js" defer></script>
    <script src="js/journal.js" defer></script>
    <script src="js/cheatsheet.js" defer></script>
    <script src="js/app.js" defer></script>
</head>
<body>
    <header class="appHeader">
        <h1>Bil Journal</h1>
    </header>

    <main class="appContent">
        <!-- Valg av kjøretøy -->
        <section id="vehicleSelector" class="vehicleSelector">
            
            <h2>Mine biler</h2>

            <div id="vehicleList" class="vehicleList">

            </div>

        </section>
        <!-- Valgt kjøretøy visning -->
        <section id="vehicleView" class="vehicleView" hidden>

            <header class="vehicleHeader">

                <div id="vehicleNavigation" class="vehicleNavigation">
                    <!-- Bilvelger i header -->
                </div>

                <div class="vehicleInfo" id="vehicleInfo">
                    <h2 id="vehicleName"></h2>
                    <p id="vehicleRegistration"></p>
                    <p id="vehicleYear"></p>

                    <button
                        type="button"
                        id="openCheatsheetButton">
                        Teknisk informasjon →
                    </button>
                </div>

            </header>

            <!-- Cheatsheet -->
            <section
                id="cheatsheetView"
                class="cheatsheetView"
                hidden>

                <button
                    type="button"
                    id="cheatsheetBackButton">
                    ← Tilbake til journal
                </button>

                <article class="cheatsheetCard">

                    <header class="cheatsheetHeader">
                        <h2 id="cheatsheetVehicleName"></h2>
                        <p id="cheatsheetRegistration"></p>
                        <p id="cheatsheetYear"></p>

                        <button
                            type="button"
                            id="cheatsheetEditButton">
                            Rediger
                        </button>
                    </header>

                    <!-- Lesemodus -->
                    <div id="cheatsheetContent"></div>

                    <!-- Redigeringsmodus -->
                    <form
                        id="cheatsheetEditForm"
                        class="cheatsheetEditForm"
                        hidden>

                        <div id="cheatsheetFormFields"></div>

                        <div class="cheatsheetFormActions">

                            <button
                                type="button"
                                id="cheatsheetEditCancelButton">
                                Avbryt
                            </button>

                            <button
                                type="submit"
                                id="cheatsheetSaveButton">
                                Lagre endringer
                            </button>

                        </div>

                    </form>

                </article>

            </section>

            <!-- Ny/Redigere Journal Post-->
            <section id="journalFormView" class="journalFormView" hidden>

                <header class="journalFormHeader">
                    <h2 id="journalFormHeading">Ny loggføring</h2>
                </header>

                <form id="journalForm">

                    <div class="formGroup">
                        <label for="journalFormDate">Dato</label>
                        <input
                            type="date"
                            id="journalFormDate"
                            required
                        >
                    </div>

                    <div class="formGroup">
                        <label for="journalFormOdometer">Kilometerstand</label>
                        <input
                            type="number"
                            id="journalFormOdometer"
                            min="0"
                            required
                        >
                    </div>

                    <div class="formGroup">
                        <label for="journalFormType">Type</label>

                        <select id="journalFormType" required>
                            <option value="">Velg type</option>
                            <option value="SERVICE">Service</option>
                            <option value="REPAIR">Reparasjon</option>
                            <option value="WORKSHOP">Verksted</option>
                            <option value="MODIFICATION">Modifikasjon</option>
                        </select>
                    </div>

                    <div class="formGroup">
                        <label for="journalFormTitle">Tittel</label>
                        <input
                            type="text"
                            id="journalFormTitle"
                            required
                        >
                    </div>

                    <div class="formGroup">
                        <label for="journalFormDescription">Beskrivelse</label>
                        <textarea
                            id="journalFormDescription"
                            rows="8"
                        ></textarea>
                    </div>

                    <section class="journalFormMedia">

                        <h3>Media</h3>

                        <div
                            id="journalFormMediaGallery"
                            class="mediaGallery">
                        </div>

                        <label
                            for="journalFormMediaInput"
                            class="mediaUploadButton">
                            + Legg til bilder
                        </label>

                        <input
                            type="file"
                            id="journalFormMediaInput"
                            accept="image/*"
                            multiple
                            hidden
                        >

                    </section>

                    <div class="journalFormActions">

                        <button
                            type="button"
                            id="journalFormCancelButton"
                        >
                            Avbryt
                        </button>

                        <button
                            type="submit"
                            id="journalFormSaveButton"
                        >
                            Lagre
                        </button>

                    </div>

                </form>

            </section>
            <!-- Journal seksjon -->
            <section id="journalView" class="journal">

                <header class="journalHeader">
                    <h2>Journal</h2>

                    <button id="newJournalEntryButton" type="button">
                        + Ny loggføring
                    </button>
                </header>

                <!-- Filter -->
                 <nav class="journalFilter" aria-label="Filter Journal">

                    <button type="button" data-filter="ALL">
                        Alle
                    </button>

                    <button type="button" data-filter="SERVICE">
                        Service
                    </button>

                    <button type="button" data-filter="REPAIR">
                        Reparasjon
                    </button>

                    <button type="button" data-filter="WORKSHOP">
                        Verksted
                    </button>
                    <button type="button" data-filter="MODIFICATION">
                        Modifikasjon
                    </button>

                 </nav>

                 <!-- Loggføringer -->
                 <div id="journalList" class="journalList">
                    <!-- JS oppgave å generere -->
                 </div>

             </section>

             <!-- Vise Loggføringer -->
              <section id="journalEntryView" class="journalEntryView" hidden>
     
                 <button type="button" id="journalBackButton">
                     &LeftArrow; Tilbake
                 </button>
     
                 <article class="journalEntry">
     
                     <header class="journalEntryHeader">
     
                         <p id="journalEntryType"></p>
     
                         <h2 id="journalEntryTitle"></h2>
     
                         <div class="journalEntryMeta">
                             <span id="journalEntryDate"></span>
                             <span id="journalEntryOdometer"></span>
                         </div>
     
                     </header>
     
                     <section class="journalEntryDescription">
                         <h3>Beskrivelse</h3>
     
                         <p id="journalEntryDescription"></p>
                     </section>
     
                     <section class="journalEntryMedia">
                         <h3>Media</h3>
     
                         <div id="journalEntryMediaGallery" class="mediaGallery">
                             <!-- JS oppgave -->
                         </div>
                     </section>

                     <div class="journalEntryActions">

                        <button
                            type="button"
                            id="editJournalEntryButton"
                        >
                            Rediger
                        </button>

                        <button
                            type="button"
                            id="deleteJournalEntryButton"
                        >
                            Slett loggføring
                        </button>

                    </div>
     
                 </article>
     
              </section>
        </section>


    </main>
    <!-- Forstørret bildevisning -->
    <div
        id="imageLightbox"
        class="imageLightbox"
        role="dialog"
        aria-modal="true"
        aria-label="Bildevisning"
        hidden
    >
        <button
            type="button"
            id="imageLightboxClose"
            aria-label="Lukk bilde"
        >
            &times;
        </button>

        <div id="imageLightboxStage" class="imageLightboxStage">
            <img
                id="imageLightboxImage"
                alt="Forstørret bilde"
            >
        </div>
    </div>
</body>
</html>
